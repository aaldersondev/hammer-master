# Whitelist des matériaux du skill gmod-map-maker.
# Seuls ces matériaux (+ tools, + le "kit" déclaré dans la spec d'une map) passent valider.py.
# Chaque entrée a été VUE sur une planche (textures_planche.py --whitelist) : jamais de nom de mémoire.
# source : gmod / hl2 = chez tous les joueurs ; cstrike = livré dans sourceengine/ de l'install,
# non garanti chez tous les joueurs (vérifier en jeu avec whereis, ou packer) ; projet = packé par compiler.py.
version: 1
echelle_defaut: 0.25

# Blockout (phase 1) : le générateur remplace TOUS les matériaux par ceux-ci quand phase = blockout.
blockout:
  sol: dev/dev_measuregeneric01b
  mur: dev/dev_measurewall01a
  plafond: dev/dev_measuregeneric01b
  facade: dev/dev_measurewall01d
  sol_exterieur: dev/dev_measuregeneric01b
  detail: dev/dev_measuregeneric01
  escalier: dev/dev_measurestairs01a
  verre: dev/dev_glassfrosted01a

# Textures d'outils : toujours autorisées.
tools:
  - tools/toolsnodraw        # face jamais vue : scelle, coupe, ne se dessine pas
  - tools/toolsskybox        # ciel (plafond et haut des murs d'un extérieur)
  - tools/toolsskybox2d
  - tools/toolsblack
  - tools/toolsclip
  - tools/toolsplayerclip
  - tools/toolsinvisible
  - tools/toolsinvisibleladder   # brosse func_ladder (bloc classe: func_ladder), ajouté le 06/11/2026
  - tools/toolstrigger
  - tools/toolsareaportal
  - tools/toolshint
  - tools/toolsskip
  - tools/toolsorigin

# Usages : 6 à 14 matériaux par usage, choisis sur planche (02/11/2026). Échelles mesurées sur la VTF
# (période du motif) : à 0,25, une texture de 512 px couvre 128 unités. Briques HL2 : ~34 rangs par
# texture, soit ~3,75 u par rang à 0,25 (taille réelle d'un rang de brique).
