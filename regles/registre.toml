# Registre des défauts connus de rp_megalopole : chaque défaut est rattaché à la règle qui l'attrape et au test qui
# le prouve, ou dit pourquoi aucune règle ne l'attrape.
#
# couverture :
#   "regle"       une règle le signale ; `regle` et `test` sont remplis
#   "partielle"   une règle en attrape une partie, ou n'a pas de test sur ce cas précis
#   "phase4"      c'est une règle de conception (ce qu'une pièce doit contenir, les dégagements) : modèle sémantique
#   "hors_portee" l'outil ne peut pas le voir (lumière, ombres, visibilité calculées par le compilateur)
#   "conception"  ce n'est pas un défaut de la map mais une demande de changement
#   "aucune"      rien ne l'attrape encore ; `note` dit quelle règle il faudrait
#
# Le test crates/hm-regles/tests/registre.rs contrôle ce fichier : règles existantes, tests existants, et toute
# règle du catalogue citée par au moins un test.

