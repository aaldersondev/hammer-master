# Essai du constructeur : une spec que les deux générateurs doivent refuser avec les mêmes messages, avant de creuser.
carte: essai_erreurs_zones
murs: 16
dalles: 16
materiaux: {sol: concrete/concretefloor011a, mur: plaster/plasterwall017a, plafond: plaster/plasterwall051b}
zones:
  - {nom: a, type: piece, origine: [0, 0, 0], taille: [256, 256, 128]}
  - {nom: b, type: piece, origine: [128, 0, 0], taille: [256, 256, 128]}
  - {nom: c, type: couloir, contre: {zone: a, cote: travers}, taille: [64, 256, 96]}
  - {nom: d, type: piece, contre: {zone: inconnue, cote: est}, taille: [64, 64, 128]}
  - {nom: e, type: piece, origine: [1000, 8, 0], taille: [256, 256, 128]}
  - {nom: f, type: piece, origine: [0, 264, 0], taille: [256, 256, 100], exception: "plafond bas voulu"}
  - {nom: a, type: piece, origine: [0, 2000, 0], taille: [256, 256, 128]}
ouvertures:
  - {type: porte, entre: [a, e]}
  - {type: porte, entre: [a, zzz]}
  - {nom: g, type: piece, role: salle_de_jeux, origine: [3000, 0, 0], taille: [256, 256, 128]}
