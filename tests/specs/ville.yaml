# Essai du constructeur : ce que la démo du skill n'exerce pas. Deux bâtiments et une masse pleine dans une enceinte
# à ciel ouvert (zone englobante, ciel dès le sol), un étage par trémie, un escalier plein avec sa rampe de clip,
# une porte en solides, une fenêtre sans vitre, une rampe, un bloc du monde, des lumières omni.
carte: essai_ville
description: "Essai : bâtiments dans une enceinte, étage par trémie"
phase: texture
ciel: sky_day01_09
murs: 16
dalles: 16
soleil: {cap: 120, hauteur: 40, lumiere: "255 240 220 300", ambiante: "120 140 180 60", etalement: 3}
kit: [{nom: brick/brickwall001a, echelle: 0.5}]
materiaux:
  sol: concrete/concretefloor011a
  mur: plaster/plasterwall017a
  plafond: plaster/plasterwall051b
  detail: concrete/concretewall001a
  sol_exterieur: stone/stonefloor006a
  facade: brick/brickwall003a
  toit: props/tarpaperroof002a
  verre: glass/glasswindowbreak070a

zones:
  - nom: rdc
    type: piece
    role: vide
    origine: [0, 0, 0]
    taille: [384, 384, 160]
    plinthe: {hauteur: 16, epaisseur: 8}
    lumiere: {type: omni, espacement: 192, modele: aucun, intensite: 200}
    materiaux: {facade: brick/brickwall001a, toit: metal/metalroof005a}
  - nom: etage
    type: piece
    role: vide
    contre: {zone: rdc, cote: dessus, aligne: debut}
    taille: [384, 384, 160]
    lumiere: aucune
    decor: {pilastres: {espacement: 128}, corniche: false}
    cubemap: [64, 64, 96]
  - nom: remise
    type: piece
    role: vide
    contre: {zone: rdc, cote: est, aligne: fin, mur: 32, decalage: -64}
    taille: [256, 192, 128]
    lightmap: 32
  - nom: masse
    type: piece
    plein: true
    origine: [-512, 0, 0]
    taille: [256, 256, 320]
    materiaux: {facade: concrete/concretewall041a}
  - nom: ville
    type: exterieur
    englobe: true
    marge: {sud: 256, nord: 128, est: 128, ouest: 128}
    hauteur_murs: 0
    hauteur: 768

ouvertures:
  - {type: tremie, entre: [rdc, etage], rect: [64, 64, 128, 192]}
  - {type: porte, nom: porte_rue, entre: [rdc, ville], cote: sud, decalage: 192, entite: func_door}
  - {type: fenetre, entre: [rdc, ville], cote: nord, decalage: 128, vitre: false, cadre: true, linteau: 8}
  - {type: passage, entre: [rdc, remise], largeur: 96, hauteur: 112, decalage: 16}

elements:
  - {type: escalier, zone: rdc, depart: [80, 80], direction: nord, largeur: 96, hauteur: 176, marche: 16, giron: 16, clip: true}
  - {type: rampe, zone: ville, depart: [64, 64], direction: est, largeur: 128, longueur: 128, hauteur: 32}
  - {type: bloc, nom: socle, classe: monde, zone: ville, rect: [320, 64, 64, 64], hauteur: 64, lightmap: 64}
  - {type: bloc, nom: caisse, classe: func_brush, zone: rdc, rect: [280, 280, 48, 48], hauteur: 40}

entites:
  - {classe: info_player_start, zone: rdc, position: [200, 300], angle: 90, nombre: 3}
  - {classe: prop_static, zone: ville, position: [128, 200, 0], modele: models/props_c17/furnitureshelf002a.mdl}
  - {classe: prop_static, zone: remise, position: [128, 96], angle: 45, modele: models/props_c17/furnitureshelf002a.mdl}
  - {classe: info_target, zone: etage, position: centre, cles: {targetname: repere, speed: 1.5, actif: true}}
